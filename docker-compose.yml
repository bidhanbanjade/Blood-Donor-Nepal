services:
  # PostgreSQL Database
  postgres:
    image: postgres:14-alpine
    container_name: bidhan-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: blood_donation_nepal
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d
    networks:
      - bidhan-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bidhan-backend
    environment:
      NODE_ENV: development
      PORT: 5000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: blood_donation_nepal
      DB_USER: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: your_jwt_secret_key_here
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-dummy_key}
      A2A_API_KEY: ${A2A_API_KEY:-dummy_key}
      FRONTEND_URL: http://localhost:5173
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/src
    networks:
      - bidhan-network
    command: npm run dev

  # Frontend (optional, can run separately)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bidhan-frontend
    environment:
      VITE_API_URL: http://localhost:5000/api
      VITE_GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-dummy_key}
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    networks:
      - bidhan-network
    depends_on:
      - backend

volumes:
  postgres_data:

networks:
  bidhan-network:
    driver: bridge
